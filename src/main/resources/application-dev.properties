# =============================================================
#  application-dev.properties  —  LOCAL DEVELOPMENT overrides
#  Activated when: SPRING_PROFILES_ACTIVE=dev  (the default)
# =============================================================

# ─────────────────────────────────────────────
# DATABASE — local PostgreSQL
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/realestate_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate: auto-create tables from entities during early dev
# Switch to 'validate' once you introduce Flyway migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ─────────────────────────────────────────────
# REDIS — local (brew install redis / docker)
# ─────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ─────────────────────────────────────────────
# JWT — relaxed secret for local only
# ─────────────────────────────────────────────
# Base64-encoded secret (must be ≥32 bytes decoded). Generate new one for prod.
app.jwt.secret=RGV2U2VjcmV0S2V5Rm9yTG9jYWxEZXZPbmx5Q2hhbmdlSW5Qcm9kMTIzNA==
app.jwt.access-token-expiry-ms=604800000

# ─────────────────────────────────────────────
# CORS — allow local Next.js dev server
# ─────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ─────────────────────────────────────────────
# EMAIL — use Mailtrap (free sandbox) locally
# Signup at mailtrap.io and paste your SMTP creds below
# ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:your_mailtrap_username}
spring.mail.password=${MAIL_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The creds above are placeholders by design (SETUP.md), so MailHealthIndicator
# authenticates against Mailtrap, gets 535 Invalid credentials, and pins
# /actuator/health to DOWN forever — which trains you to ignore the one signal
# that is supposed to mean something. Dev health now reflects what dev actually
# depends on: db, disk, ping. Prod keeps the indicator (its creds are real).
management.health.mail.enabled=false

# ─────────────────────────────────────────────
# LOCAL FILE STORAGE — images saved to disk
# Served at: http://localhost:8080/uploads/**
# ─────────────────────────────────────────────
app.storage.upload-dir=uploads
# Set APP_BASE_URL to your LAN IP (e.g. http://192.168.1.42:8080/api) when a
# phone/emulator has to load these images — "localhost" resolves to the device.
app.storage.base-url=${APP_BASE_URL:http://localhost:8080/api}

# ─────────────────────────────────────────────
# LOGGING — verbose in dev
# ─────────────────────────────────────────────
logging.level.com.realestate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ─────────────────────────────────────────────
# Swagger visible on dev
# ─────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
